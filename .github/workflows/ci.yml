name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.5']

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: blog_test
          MYSQL_USER: blog
          MYSQL_PASSWORD: secret
          MYSQL_RANDOM_ROOT_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DB_HOST: 127.0.0.1
      DB_USER: blog
      DB_PASSWORD: secret

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Папка кэша Composer
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ matrix.php }}-

      - name: Проверка composer.json
        run: composer validate --strict

      - name: Зависимости
        run: composer install --no-interaction --no-progress

      - name: PHPStan
        run: composer analyse

      - name: PHPUnit
        run: composer test

  styles:
    name: SCSS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Тот же dart-sass, что в compose: стадия sass из Dockerfile
      - name: Сборка стилей
        run: |
          docker build --target sass -t blog-sass .
          docker run --rm -v "$PWD/assets:/app/assets:ro" blog-sass sass --no-source-map --style=compressed assets/scss/app.scss /tmp/app.css

  demo:
    name: Образ демо
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Сборка образа «всё в одном»
        run: docker build -f docker/demo/Dockerfile -t blog-demo .

      # Контейнер поднимает MySQL, засевает базу и запускает сайт: главная должна ответить 200
      - name: Сайт отвечает
        run: |
          docker run -d --name demo -p 8080:10000 blog-demo
          for i in $(seq 60); do
            curl -sf -o /dev/null http://localhost:8080/ && exit 0
            sleep 1
          done
          docker logs demo
          exit 1
