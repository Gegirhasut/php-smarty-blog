services:
  nginx:
    image: nginx:1.29-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
    depends_on:
      php:
        condition: service_healthy
      # nginx стартует, когда CSS уже собран: страницы сразу открываются со стилями
      sass:
        condition: service_healthy

  # Собирает assets/scss в public/assets/css/app.css и пересобирает при каждом изменении.
  # --poll: события файловой системы из папки хоста доходят до контейнера не везде (Docker Desktop)
  sass:
    build:
      context: .
      target: sass
    command: sass --watch --poll --style=compressed assets/scss/app.scss:public/assets/css/app.css
    volumes:
      - ./assets:/app/assets:ro
      - ./public/assets/css:/app/public/assets/css
    healthcheck:
      test: ["CMD", "test", "-s", "public/assets/css/app.css"]
      interval: 2s
      timeout: 3s
      retries: 30

  php:
    build: .
    command: sh -c "composer install --no-interaction --no-progress && exec php-fpm"
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_URL: ${APP_URL:-http://localhost:${APP_PORT:-8080}}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-blog}
      DB_USER: ${DB_USER:-blog}
      DB_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - .:/var/www/html
      # php-fpm пишет сюда шаблоны Smarty, а в папку с хоста (на Linux) у него может не быть прав
      - var:/var/www/html/var
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "9000"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2m
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_NAME:-blog}
      MYSQL_USER: ${DB_USER:-blog}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 1m

volumes:
  mysql-data:
  var:
