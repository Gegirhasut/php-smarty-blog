server {
    listen 80;
    server_name _;
    root /var/www/html/public;

    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json application/xml application/rss+xml image/svg+xml;

    error_page 404 /index.php;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    # Без internal у каждой страницы появился бы дубль с /index.php в адресе
    location = /index.php {
        internal;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass php:9000;
    }

    location ~ \.php$ {
        return 404;
    }

    # Расширения webmanifest нет в mime.types nginx
    location = /site.webmanifest {
        default_type application/manifest+json;
    }

    location ~* \.(?:css|js|svg|ico|png|jpe?g|gif|webp|avif|woff2?)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }
}
