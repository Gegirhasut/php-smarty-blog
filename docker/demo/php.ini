; Поверх php.ini-production: ошибки только в лог, код не меняется после сборки образа
expose_php = Off
display_errors = Off
log_errors = On

; DB_HOST=localhost: PDO идёт в MySQL через этот сокет, а не по TCP
pdo_mysql.default_socket = /run/mysqld/mysqld.sock

opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 32
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 4000
