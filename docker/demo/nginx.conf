# nginx для демо. Правила сайта - site.conf, его start-demo собирает из docker/nginx/default.conf
user www-data;
# Один процесс: на бесплатном плане 0,1 CPU, а каждый лишний процесс - это память
worker_processes 1;
pid /run/nginx.pid;
error_log stderr warn;

events {
    worker_connections 256;
}

http {
    include mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    keepalive_timeout 30s;

    include /etc/nginx/site.conf;
}
